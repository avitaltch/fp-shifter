name: shiftsync-mvp

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shiftsync
      POSTGRES_USER: shiftsync
      POSTGRES_PASSWORD: ${MVP_POSTGRES_PASSWORD:-shiftsync_local}
    ports:
      - "127.0.0.1:${MVP_POSTGRES_PORT:-54320}:5432"
    volumes:
      - mvp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftsync -d shiftsync"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./apps/api
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://shiftsync:${MVP_POSTGRES_PASSWORD:-shiftsync_local}@postgres:5432/shiftsync
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgres://shiftsync:${MVP_POSTGRES_PASSWORD:-shiftsync_local}@postgres:5432/shiftsync
      CORS_ORIGINS: ${MVP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SWAGGER_ENABLED: ${MVP_SWAGGER_ENABLED:-true}
      MANAGEMENT_TOKEN_SECRET: ${MVP_MANAGEMENT_TOKEN_SECRET:?set MVP_MANAGEMENT_TOKEN_SECRET}
      MANAGEMENT_TOKEN_TTL_DAYS: ${MVP_MANAGEMENT_TOKEN_TTL_DAYS:-365}
      AUTH_TOKEN_SECRET: ${MVP_AUTH_TOKEN_SECRET:-local-auth-token-secret-change-before-production}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${MVP_AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${MVP_AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      AUTH_LOGIN_IP_LIMIT: ${MVP_AUTH_LOGIN_IP_LIMIT:-20}
      AUTH_LOGIN_EMAIL_LIMIT: ${MVP_AUTH_LOGIN_EMAIL_LIMIT:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${MVP_AUTH_LOGIN_WINDOW_SECONDS:-900}
      PUBLIC_BOOKING_IP_LIMIT: ${MVP_PUBLIC_BOOKING_IP_LIMIT:-20}
      PUBLIC_BOOKING_IP_WINDOW_SECONDS: ${MVP_PUBLIC_BOOKING_IP_WINDOW_SECONDS:-300}
      PUBLIC_BOOKING_CONTACT_LIMIT: ${MVP_PUBLIC_BOOKING_CONTACT_LIMIT:-5}
      PUBLIC_BOOKING_CONTACT_WINDOW_SECONDS: ${MVP_PUBLIC_BOOKING_CONTACT_WINDOW_SECONDS:-3600}
      WAITLIST_OFFER_TTL_SECONDS: ${MVP_WAITLIST_OFFER_TTL_SECONDS:-300}
    ports:
      - "127.0.0.1:${MVP_API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ./apps/api
    command: ["npm", "run", "start:worker"]
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgres://shiftsync:${MVP_POSTGRES_PASSWORD:-shiftsync_local}@postgres:5432/shiftsync
      CORS_ORIGINS: ${MVP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SWAGGER_ENABLED: "false"
      MANAGEMENT_TOKEN_SECRET: ${MVP_MANAGEMENT_TOKEN_SECRET:?set MVP_MANAGEMENT_TOKEN_SECRET}
      MANAGEMENT_TOKEN_TTL_DAYS: ${MVP_MANAGEMENT_TOKEN_TTL_DAYS:-365}
      AUTH_TOKEN_SECRET: ${MVP_AUTH_TOKEN_SECRET:-local-auth-token-secret-change-before-production}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${MVP_AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${MVP_AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      AUTH_LOGIN_IP_LIMIT: ${MVP_AUTH_LOGIN_IP_LIMIT:-20}
      AUTH_LOGIN_EMAIL_LIMIT: ${MVP_AUTH_LOGIN_EMAIL_LIMIT:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${MVP_AUTH_LOGIN_WINDOW_SECONDS:-900}
      WAITLIST_OFFER_TTL_SECONDS: ${MVP_WAITLIST_OFFER_TTL_SECONDS:-300}
      NOTIFICATION_WORKER_BATCH_SIZE: ${MVP_NOTIFICATION_WORKER_BATCH_SIZE:-50}
      NOTIFICATION_WORKER_LEASE_SECONDS: ${MVP_NOTIFICATION_WORKER_LEASE_SECONDS:-300}
      NOTIFICATION_WORKER_POLL_MS: ${MVP_NOTIFICATION_WORKER_POLL_MS:-1000}
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed:
    profiles: ["tools"]
    build:
      context: ./apps/api
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgres://shiftsync:${MVP_POSTGRES_PASSWORD:-shiftsync_local}@postgres:5432/shiftsync
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  mvp_postgres_data:
