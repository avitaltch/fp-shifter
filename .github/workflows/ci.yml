name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shiftsync_test
          POSTGRES_USER: shiftsync
          POSTGRES_PASSWORD: shiftsync_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftsync -d shiftsync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VITE_API_URL: http://127.0.0.1:3000/api/v1
      DATABASE_URL: postgres://shiftsync:shiftsync_ci@127.0.0.1:5432/shiftsync_test
      MANAGEMENT_TOKEN_SECRET: ci-only-management-token-secret-at-least-32-bytes
      MANAGEMENT_TOKEN_TTL_DAYS: 365
      AUTH_TOKEN_SECRET: ci-only-auth-token-secret-different-and-at-least-32-bytes
      NOTIFICATION_WORKER_BATCH_SIZE: 50
      NOTIFICATION_WORKER_LEASE_SECONDS: 300
      NOTIFICATION_WORKER_POLL_MS: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/api ci
      - run: npm run lint
      - run: npm run api:lint
      - run: npm run api:typecheck
      - run: npm run api:test
      - run: npm run api:build
      - run: npm --prefix apps/api run db:migrate
      - run: npm --prefix apps/api run db:seed
      - run: npm --prefix apps/api run auth:create-owner
        env:
          OWNER_BUSINESS_SLUG: happy-pets-demo
          OWNER_EMAIL: groomer@happy-pets.demo
          OWNER_PASSWORD: E2e-owner-password-2026
          OWNER_FIRST_NAME: Dana
          OWNER_LAST_NAME: Groomer
      - run: npm run api:test:integration
        env:
          NODE_ENV: test
          API_HOST: 127.0.0.1
          API_PORT: 3000
          CORS_ORIGINS: http://localhost:5173
          SWAGGER_ENABLED: false
      - run: npm --prefix apps/api run db:migrate:down
      - run: npm --prefix apps/api run db:migrate
      - run: npm run sql:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start NestJS API
        run: |
          npm --prefix apps/api run start > /tmp/shiftsync-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shiftsync-api.log
          exit 1
      - run: npm run e2e
        env:
          CI: true
          E2E_REAL_STACK: true
          E2E_OWNER_EMAIL: groomer@happy-pets.demo
          E2E_OWNER_PASSWORD: E2e-owner-password-2026
